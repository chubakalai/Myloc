# fly.toml app configuration file generated for mldca on 2026-07-28T09:12:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'myloc'
primary_region = 'gre'

[build]

[env]
  TRACKER_DATA_DIR = "/data"

[http_service]
  # Must match HTTP_PORT in sp500_tracker.py (which is 8000, not 8080).
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'mylocd'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
