# fly.toml app configuration file generated for myloc-yyajhq on 2026-11-22T07:53:01Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'myloc-yyajhq'
primary_region = 'jnb'

[build]
[env]
  TRACKER_DATA_DIR = '/data'

[[mounts]]
  source = 'mount'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
